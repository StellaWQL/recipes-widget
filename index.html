<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9a8794">
  <meta name="description" content="THE RAVEN，藏在纸剧场里的日常。">
  <title>THE RAVEN.</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles/theatre.css">
  <link rel="stylesheet" href="./styles/motion.css">
  <link rel="stylesheet" href="./styles/tarot.css">
  <link rel="stylesheet" href="./styles/reader.css">
</head>
<body>
  <main id="theatre" aria-label="纸剧场">
    <div class="stage-frame">
      <img class="stage-art" src="./assets/art/paper-theatre.png" alt="" fetchpriority="high" draggable="false">
      <svg class="scene-overlay" viewBox="0 0 1672 941" aria-hidden="true" focusable="false">
        <defs>
          <image id="scene-original" href="./assets/art/paper-theatre.png" width="1672" height="941"/>
          <image id="scene-clean" href="./assets/art/paper-theatre-clean.png" width="1672" height="941"/>
          <image id="paper-props" href="./assets/art/paper-props.png" width="1673" height="940"/>
          <clipPath id="clip-bird"><path d="M675 191.5 L776.5 191.5 L825 238.5 L853.5 213.5 Q859 209 870 214 L882.5 227.5 L917.5 241.5 L880.5 234.5 L867 247 L846 283.5 L820 301 L811 297.5 L766 298.5 L732.5 333.5 L731 321 L717 328 L718.5 312 L704 308 L785 267 Q773 264 768 258 Q759 258 756 252 L757 249 Q745 250 741 246 Q739 244 741 239 L743 237 Q727 239 720 231 Q718 229 721 226 L723 224 Q708 226 697 217 Q693 214 696 211 L699 209 Q683 209 675 191.5 Z M844 259 L919 242 L944 302 L860 335 Z"/></clipPath>
<clipPath id="clip-lid"><path d="M506 684 L683 638 L816 680 L815 709 L637 760 L506 714 Z"/></clipPath>
<clipPath id="clip-petal"><path d="M1010 791 Q1016 785 1024 792 L1044 806 Q1060 796 1073 790 Q1097 779 1115 783 Q1107 790 1104 800 Q1098 814 1086 820 Q1059 828 1039 815 Q1028 810 1023 800 Z"/></clipPath>
<clipPath id="clip-box-front"><path d="M510 703 L637 748 L811 694 L811 797 L638 841 L509 801 Z"/></clipPath>
<clipPath id="clip-basket-front"><path d="M87 646 Q89 635 101 636 Q119 649 151 655 Q195 667 243 657 Q281 649 322 640 Q354 625 376 634 L405 850 H80 Z"/></clipPath>
<clipPath id="clip-curtain-aperture"><path d="M407 416 H618 V653 H407 Z"/></clipPath>
<clipPath id="clip-stage-frame"><path d="M375 319 H649 V422 H375 Z M375 410 H408 V667 H375 Z M618 410 H649 V667 H618 Z M390 653 H640 V667 H390 Z"/></clipPath>
<clipPath id="clip-bookmark-exit"><path d="M1160 615 L1211 622 L1234 626 L1260 630 V725 H1160 Z"/></clipPath>
          <filter id="city-mask-edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
          <mask id="mask-city-light" maskUnits="userSpaceOnUse" x="1134" y="130" width="440" height="244">
            <rect x="1148" y="146" width="410" height="214" rx="10" fill="white" filter="url(#city-mask-edge)"/>
          </mask>
          <symbol id="paper-card-back" viewBox="0 0 3 4">
            <image href="./assets/art/tarot-back.png" width="3" height="4"/>
          </symbol>
        </defs>
        <use href="#scene-clean"/>
        <!-- Painted light lives inside the windows, including warm sills and paper grain. -->
        <image class="scene-city-light" href="./assets/art/city-lit.png" width="1672" height="941" mask="url(#mask-city-light)"/>
        <g class="scene-string" style="--string-origin:832px 94px">
          <path d="M832 94V231" fill="none" stroke="#b79d7d" stroke-width="1.3"/>
        </g>
        <g class="scene-bird" ><use href="#scene-original" clip-path="url(#clip-bird)"/></g>
        <!-- Both paper panels are closed at rest and slide laterally behind the wooden frame. -->
        <g clip-path="url(#clip-curtain-aperture)">
          <g class="scene-curtain-left"><svg x="404" y="408" width="111" height="249" viewBox="506 103 391 738" preserveAspectRatio="none" overflow="hidden"><use href="#paper-props"/></svg></g>
          <g class="scene-curtain-right"><svg x="514" y="408" width="109" height="249" viewBox="897 103 384 738" preserveAspectRatio="none" overflow="hidden"><use href="#paper-props"/></svg></g>
        </g>
        <g class="" ><use href="#scene-clean" clip-path="url(#clip-stage-frame)"/></g>
        <!-- The entire pear slides. Its complete base remains behind the fixed basket front. -->
        <g class="scene-pear"><svg x="155" y="562" width="96" height="140" viewBox="92 310 324 472" preserveAspectRatio="none" overflow="hidden"><use href="#paper-props"/></svg></g>
        <g class="" ><use href="#scene-clean" clip-path="url(#clip-basket-front)"/></g>
        <g class="scene-cards">
          <use href="#paper-card-back" x="564" y="715" width="75" height="100" transform="rotate(-12 602 765)"/>
          <use href="#paper-card-back" x="624" y="704" width="75" height="100" transform="rotate(-3 662 754)"/>
          <use href="#paper-card-back" x="683" y="698" width="75" height="100" transform="rotate(9 721 748)"/>
        </g>
        <g class="" ><use href="#scene-clean" clip-path="url(#clip-box-front)"/></g>
        <g class="scene-lid" style="--lid-origin:675px 665px"><use href="#scene-original" clip-path="url(#clip-lid)"/></g>
        <!-- A single long ribbon passes through a fixed page slit; the concealed tail moves with it. -->
        <g clip-path="url(#clip-bookmark-exit)">
          <g class="scene-bookmark"><g transform="rotate(16 1223 624)"><svg x="1209" y="536" width="28" height="145" viewBox="1396 101 143 739" preserveAspectRatio="none" overflow="hidden"><use href="#paper-props"/></svg></g></g>
        </g>
        <g class="scene-petal" style="--petal-origin:1026px 805px"><use href="#scene-original" clip-path="url(#clip-petal)"/></g>
      </svg>
      <button class="hotspot hotspot-food" data-tool="recipe" aria-label="菜谱"></button>
      <button class="hotspot hotspot-movie" data-tool="movie" aria-label="电影"></button>
      <button class="hotspot hotspot-letter" data-tool="inspiration" aria-label="生活灵感"></button>
      <button class="hotspot hotspot-city" data-tool="city" aria-label="四小时城市"></button>
      <button class="hotspot hotspot-book" data-tool="reader" aria-label="阅读"></button>
      <button class="hotspot hotspot-tarot" data-tool="tarot" aria-label="塔罗"></button>
      <button class="hotspot hotspot-petal" data-tool="directory" aria-label="全部工具"></button>
    </div>
  </main>
  <dialog id="tool-dialog" class="tool-dialog" aria-label="展开的工具">
    <button id="close-tool" class="paper-control close-tool" aria-label="回到纸剧场">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"/></svg>
    </button>
    <div id="tool-content" class="tool-content"></div>
  </dialog>
  <script type="module" src="./js/app.js?v=4"></script>
</body>
</html>
