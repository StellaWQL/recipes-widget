<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读室</title></head>
<body>
<script type="module">
  // Optional compatibility replacement for the old repository-root reader.html.
  const next = new URL('./reader-room/index.html', location.href);
  const query = new URLSearchParams(location.search);
  for (const name of ['book', 'catalog']) {
    if (!query.has(name)) continue;
    const raw = query.get(name) || '';
    try { next.searchParams.set(name, raw ? new URL(raw, location.href).href : ''); }
    catch { next.searchParams.set(name, raw); }
  }
  location.replace(next.href);
</script>
</body>
</html>
