<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9a6c76">
  <meta name="description" content="THE RAVEN 的书库与阅读室。">
  <title>THE RAVEN · 阅读室</title>
  <link rel="stylesheet" href="./room.css">
  <script src="./vendor/jszip.min.js" defer></script>
  <script src="./vendor/epub.min.js" defer></script>
  <script src="./room.js" type="module"></script>
</head>
<body class="room">
  <main class="room-app">
    <h1 class="visually-hidden">THE RAVEN 阅读室</h1>

    <section id="library-view" class="library room-view" aria-label="书库">
      <div class="library-stage">
        <div id="library-grid" class="library-grid" aria-label="藏书"></div>
        <p id="library-empty" class="library-empty" hidden>书架上暂时没有找到这本书。</p>
      </div>
      <button class="prop-button library-home prop-key" type="button" data-action="home" aria-label="回到纸剧场主页">
        <span class="prop-art art-key" aria-hidden="true"></span>
      </button>
      <button class="prop-button library-search prop-search" type="button" data-action="search" aria-label="搜索或载入图书">
        <span class="prop-art art-search" aria-hidden="true"></span>
      </button>
    </section>

    <section id="reader-view" class="reader room-view" aria-label="阅读室" hidden>
      <div id="book-shell" class="book-shell">
        <span id="running-left" class="running-title running-left" aria-hidden="true"></span>
        <span id="running-right" class="running-title running-right" aria-hidden="true"></span>
        <div id="epub-viewer" class="epub-viewer" aria-label="书籍正文"></div>
        <span id="folio-left" class="folio folio-left" aria-hidden="true"></span>
        <span id="folio-right" class="folio folio-right" aria-hidden="true"></span>
      </div>

      <button class="prop-button reader-chapters prop-programme" type="button" data-action="chapters" aria-label="打开章节目录" aria-controls="chapter-dialog" aria-haspopup="dialog">
        <span class="prop-art art-programme" aria-hidden="true"></span>
      </button>
      <button class="prop-button reader-library prop-folio" type="button" data-action="library" aria-label="回到书库">
        <span class="prop-art art-folio" aria-hidden="true"></span>
      </button>
      <button class="prop-button reader-home prop-key" type="button" data-action="home" aria-label="回到纸剧场主页">
        <span class="prop-art art-key" aria-hidden="true"></span>
      </button>
      <button class="prop-button reader-previous prop-spool" type="button" data-action="previous" aria-label="上一页" aria-keyshortcuts="K">
        <span class="prop-art art-spool art-mirrored" aria-hidden="true"></span>
      </button>
      <button class="prop-button reader-next prop-spool" type="button" data-action="next" aria-label="下一页" aria-keyshortcuts="J">
        <span class="prop-art art-spool" aria-hidden="true"></span>
      </button>
    </section>
  </main>

  <div id="room-status" class="room-status" role="status" aria-live="polite" hidden>
    <span id="status-message"></span>
    <button class="paper-button" type="button" data-action="retry" hidden>重试</button>
  </div>

  <dialog id="chapter-dialog" class="paper-dialog chapter-dialog" aria-labelledby="chapter-title">
    <button class="dialog-close" type="button" data-action="close-dialog" aria-label="关闭章节目录"><span aria-hidden="true">×</span></button>
    <div class="dialog-ornament" aria-hidden="true"></div>
    <h2 id="chapter-title">章节</h2>
    <div class="font-settings" role="group" aria-label="正文字号">
      <span class="settings-label">字号</span>
      <button class="paper-button size-button" type="button" data-action="smaller" aria-label="减小字号">−</button>
      <output id="font-size-value" aria-live="polite" aria-label="当前字号">22</output>
      <button class="paper-button size-button" type="button" data-action="larger" aria-label="增大字号">+</button>
    </div>
    <nav id="chapter-list" class="chapter-list" aria-label="书籍章节"></nav>
  </dialog>

  <dialog id="search-dialog" class="paper-dialog search-dialog" aria-labelledby="search-title">
    <button class="dialog-close" type="button" data-action="close-dialog" aria-label="关闭图书搜索"><span aria-hidden="true">×</span></button>
    <h2 id="search-title">书库</h2>
    <label class="visually-hidden" for="library-search">按书名或作者搜索</label>
    <input id="library-search" class="paper-input" type="search" placeholder="书名或作者" autocomplete="off" spellcheck="false">
    <output id="search-count" class="search-count" aria-live="polite"></output>
    <div class="import-actions">
      <button class="paper-button" type="button" data-action="import">导入 EPUB</button>
    </div>
    <div id="epub-url" class="url-source">
      <form id="url-form" class="url-form">
        <label class="visually-hidden" for="url-input">EPUB 文件地址</label>
        <input id="url-input" class="paper-input" type="url" inputmode="url" placeholder="EPUB 文件地址" autocomplete="url" spellcheck="false" required>
        <button class="paper-button" type="submit">打开</button>
      </form>
    </div>
  </dialog>

  <input id="import-file" type="file" accept=".epub,application/epub+zip" hidden>
</body>
</html>
